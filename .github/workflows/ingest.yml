name: Ingest

on:
  schedule:
    # Off the hour so Neon can scale to zero between runs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run a full backfill
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A full backfill takes ~11 min under the anonymous Leaguepedia rate limit.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v7
      # Migrations are embedded by sqlx::migrate!(), so they are part of the key.
      - id: binary
        uses: actions/cache/restore@v6
        with:
          path: ingestor/target/release/ingestor
          key: ingestor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'ingestor/Cargo.toml', 'ingestor/Cargo.lock', 'ingestor/src/**', 'ingestor/migrations/**') }}
      - if: steps.binary.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ingestor
      - if: steps.binary.outputs.cache-hit != 'true'
        run: cargo build --release --locked
      - if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ingestor/target/release/ingestor
          key: ${{ steps.binary.outputs.cache-primary-key }}
      - name: Run ingestor
        env:
          INGESTOR_DATABASE_URL: ${{ secrets.INGESTOR_DATABASE_URL }}
        run: ./target/release/ingestor ${{ inputs.full && '--full' || '' }}
