name: Ingest

# Schedule (7,22,37,52 * * * *) is enabled in M4 once the pipeline exists.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Run a full backfill
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A full backfill takes ~11 min under the anonymous Leaguepedia rate limit.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ingestor
      - run: cargo build --release --locked
      - name: Run ingestor
        env:
          INGESTOR_DATABASE_URL: ${{ secrets.INGESTOR_DATABASE_URL }}
        run: ./target/release/ingestor ${{ inputs.full && '--full' || '' }}
