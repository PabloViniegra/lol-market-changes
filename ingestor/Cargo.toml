[package]
name = "ingestor"
version = "0.1.0"
edition = "2024"
default-run = "ingestor"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.8", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "form"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "chrono", "json"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
